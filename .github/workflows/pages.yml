name: Deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - master
      - main
      - zh-tw-server

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch marketshare data
        env:
          FF14GILS_SERVER: 伊弗利特
          FF14GILS_WORLDS: 伊弗利特,迦樓羅,利維坦,鳳凰,奧汀,巴哈姆特,拉姆,泰坦
          FF14GILS_PERIODS: 1d,3d,7d
          FF14GILS_ITEM_NAME_LANGUAGE: tc
          FF14GILS_ITEM_LIMIT: all
          FF14GILS_MAX_ITEMS: 1000
          FF14GILS_FETCH_CHUNK_DELAY_MS: 100
        run: npm run fetch:data

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
