    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FF14Gils",
        "url": "https://aki-terminal-leaf.github.io/FF14Gils/",
        "description": "FF14 繁體中文玩家用的市場看板，可從銷售額、價格與成交量找出適合販售的金策候選。",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": "zh-TW",
        "image": "https://aki-terminal-leaf.github.io/FF14Gils/assets/og-image.png",
        "sameAs": ["https://ko-fi.com/jinnymeia"]
      }
    </script>
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="brand-block">
          <div class="brand-copy">
            <p class="eyebrow" data-i18n="ui.eyebrow">FF14 市場金策</p>
            <h1>FF14Gils</h1>
            <p class="lead" data-i18n="ui.lead">
              從市場銷售量與價格趨勢，找出比較容易賣出的金策候選。
            </p>
          </div>
          <div class="header-actions">
            <label class="language-control">
              <span class="sr-only" data-i18n="ui.languageLabel">顯示語言</span>
              <select
                data-language-select
                data-i18n-attr="aria-label:ui.languageSelect"
                aria-label="選擇顯示語言"
              >
                <option value="zh">繁體中文</option>
                <option value="ja">日本語</option>
                <option value="en">English</option>
              </select>
            </label>
            <a
              class="kofi-link"
              href="https://ko-fi.com/jinnymeia"
              target="_blank"
              rel="me noopener noreferrer"
              data-i18n-attr="aria-label:ui.kofiSupport"
              aria-label="在 Ko-fi 支援原作者"
              title="Ko-fi"
            >
              <img src="assets/ko-fi.svg" width="28" height="28" alt="" aria-hidden="true" />
              <span class="sr-only" data-i18n="ui.kofiSupport">在 Ko-fi 支援原作者</span>
            </a>
          </div>
        </div>
      </header>

      <main class="dashboard-grid">
        <aside
          class="filter-panel controls"
          data-i18n-attr="aria-label:ui.filterPanelLabel"
          aria-label="篩選"
        >
          <div class="panel-heading">
            <p class="panel-kicker" data-i18n="ui.filterKicker">條件</p>
            <h2 data-i18n="ui.filterTitle">篩選</h2>
            <p data-i18n="ui.filterHelp">選擇資料中心後會縮小世界清單。選過的世界下次會自動沿用。</p>
          </div>

          <label>
            <span data-i18n="ui.dataCenterLabel">資料中心</span>
            <select
              data-dc-select
              data-i18n-attr="aria-label:ui.dataCenterSelect"
              aria-label="選擇資料中心"
            ></select>
          </label>

          <label>
            <span data-i18n="ui.worldLabel">世界</span>
            <select
              data-world-select
              data-i18n-attr="aria-label:ui.worldSelect"
              aria-label="選擇世界"
            ></select>
          </label>

          <label>
            <span data-i18n="ui.periodLabel">統計期間</span>
            <select
              data-period-select
              data-i18n-attr="aria-label:ui.periodSelect"
              aria-label="選擇銷售統計期間"
            >
              <option value="1d">1 天</option>
              <option value="3d">3 天</option>
              <option value="7d">7 天</option>
            </select>
          </label>

          <label>
            <span data-i18n="ui.itemSearch">道具搜尋</span>
            <input
              data-search
              type="search"
              data-i18n-attr="placeholder:ui.searchPlaceholder;aria-label:ui.searchLabel"
              placeholder="英文名、日文名或 ID"
              aria-label="道具搜尋"
              autocomplete="off"
            />
          </label>

          <label>
            <span data-i18n="ui.sortLabel">排序</span>
            <select data-sort-by>
              <option value="opportunityScore" data-i18n="sort.opportunityScore">推薦度</option>
              <option value="name" data-i18n="sort.name">道具名稱</option>
              <option value="marketValue" data-i18n="sort.marketValue">銷售額</option>
              <option value="quantitySold" data-i18n="sort.quantitySold">成交量</option>
              <option value="avg" data-i18n="sort.avg">平均價格</option>
              <option value="minPrice" data-i18n="sort.minPrice">最低價</option>
              <option value="percentChange" data-i18n="sort.percentChange">價格變化</option>
              <option value="state" data-i18n="sort.state">狀態</option>
            </select>
          </label>

          <label class="range-control">
            <span data-i18n="ui.minQuantity">最低成交量</span>
            <span data-min-quantity-value>0</span>
            <input data-min-quantity type="range" min="0" max="100" step="1" value="0" />
          </label>

          <fieldset>
            <legend data-i18n="ui.stateLegend">狀態</legend>
            <label><input data-state-filter type="checkbox" value="stable" /> <span data-i18n="states.stable">穩定</span></label>
            <label><input data-state-filter type="checkbox" value="increasing" /> <span data-i18n="states.increasing">上升中</span></label>
            <label><input data-state-filter type="checkbox" value="spiking" /> <span data-i18n="states.spiking">急漲</span></label>
            <label><input data-state-filter type="checkbox" value="out of stock" /> <span data-i18n="states.out_of_stock">缺貨</span></label>
            <label><input data-state-filter type="checkbox" value="decreasing" /> <span data-i18n="states.decreasing">下跌</span></label>
          </fieldset>
        </aside>

        <section
          class="results-panel results"
          data-i18n-attr="aria-label:ui.resultsLabel"
          aria-label="金策候選"
        >
          <p data-error class="error" hidden></p>
          <div class="results-header">
            <div>
              <p class="panel-kicker" data-i18n="ui.resultsKicker">清單</p>
              <h2 data-i18n="ui.resultsTitle">金策候選</h2>
            </div>
            <div class="result-meta">
              <span data-result-count>- 筆</span>
              <span class="updated-at" data-updated-at>最後更新 -</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col" aria-sort="descending">
                    <button type="button" class="sort-button" data-sort-button="opportunityScore">
                      <span data-i18n="table.rank">排名</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-button="name">
                      <span data-i18n="table.item">道具</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-button="marketValue">
                      <span data-i18n="table.marketValue">銷售額</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-button="avg">
                      <span data-i18n="table.avg">平均價格</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-button="minPrice">
                      <span data-i18n="table.minPrice">最低價</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-button="quantitySold">
                      <span data-i18n="table.quantitySold">成交量</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-button="percentChange">
                      <span data-i18n="table.percentChange">價格變化</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th scope="col" aria-sort="none">
                    <button type="button" class="sort-button" data-sort-button="state">
                      <span data-i18n="table.state">狀態</span><span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody data-results></tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a href="legal.html">權利聲明與資料來源</a>
      </footer>
    </div>
  </body>
</html>
